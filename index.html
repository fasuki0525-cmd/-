<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>オレオリ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:sans-serif;text-align:center;padding:20px}
main{max-width:500px;margin:auto}
section{background:#202e43;padding:20px;border-radius:16px;margin:16px 0}
button,input,select{padding:13px;border:0;border-radius:10px;margin:5px;font-size:16px}
button{background:#32865d;color:white;font-weight:bold}
input,select{max-width:100%}
.hidden{display:none}
.card{background:#354963;color:white;width:28%;min-height:80px;font-size:20px}
.selected{outline:3px solid #65e6a0}
</style>
</head>
<body>
<main>
<h1>オレオリ</h1>
<p>友達とじゃんけん対戦</p>

<section id="home">
<h2>対戦モード</h2>
<select id="mode">
<option value="normal">ノーマル</option>
<option value="hidden">ガチ対決・非公開</option>
<option value="open">ガチ対決・公開</option>
</select>
<p><button id="create">ルームを作る</button></p>
<hr>
<input id="joinCode" placeholder="ルームコード">
<button id="join">参加する</button>
</section>

<section id="game" class="hidden">
<h2 id="roomCode"></h2>
<p id="status">接続中...</p>
<p id="round"></p>
<div id="discardArea" class="hidden">
<h3>捨てるカードを1枚選んでください</h3>
<div id="discardCards"></div>
<button id="discard">捨てる</button>
</div>
<div id="playArea" class="hidden">
<h3>出すカードを選んでください</h3>
<div id="playCards"></div>
<button id="play">勝負！</button>
</div>
<h2 id="result"></h2>
</section>
</main>

<script>
const symbols={rock:"✊ グー",scissors:"✌ チョキ",paper:"✋ パー"};
let room=null,player=localStorage.getItem("oreori_player");
if(!player){player=crypto.randomUUID();localStorage.setItem("oreori_player",player)}
let selected=-1,timer=null;

function newDeck(){
 return ["rock","rock","rock","scissors","scissors","scissors","paper","paper","paper"];
}
function randomCode(){
 return Math.random().toString(36).slice(2,8).toUpperCase();
}
function show(id){document.getElementById(id).classList.remove("hidden")}
function hide(id){document.getElementById(id).classList.add("hidden")}
function el(id){return document.getElementById(id)}

function create(){
 const mode=el("mode").value;
 room={
 code:randomCode(),mode:mode,round:0,
 total:mode==="normal"?9:8,
 players:[{id:player,hand:newDeck(),discarded:null,pick:null}],
 result:""
 };
 el("roomCode").textContent="ルームコード："+room.code;
 hide("home");show("game");render();
}
function join(){
 alert("オンライン参加機能はまだ接続されていません。");
}
function render(){
 if(!room)return;
 el("status").textContent="プレイヤー："+room.players.length+"/2人";
 el("round").textContent="第"+(room.round+1)+"回戦 / 全"+room.total+"回戦";
 el("result").textContent=room.result;
 const me=room.players.find(p=>p.id===player);
 const needDiscard=room.mode!=="normal"&&me.discarded===null;
 if(needDiscard){
  show("discardArea");hide("playArea");
  draw("discardCards",me.hand);
 }else{
  hide("discardArea");
  if(room.round<room.total){
   show("playArea");draw("playCards",me.hand);
  }else hide("playArea");
 }
}
function draw(id,hand){
 const area=el(id);area.innerHTML="";
 hand.forEach((card,i)=>{
  const b=document.createElement("button");
  b.className="card"+(selected===i?" selected":"");
  b.textContent=symbols[card];
  b.onclick=()=>{selected=i;render()};
  area.appendChild(b);
 });
}
function discard(){
 const me=room.players.find(p=>p.id===player);
 if(selected<0)return alert("カードを選んでください");
 me.discarded=me.hand.splice(selected,1)[0];
 selected=-1;render();
}
function play(){
 const me=room.players.find(p=>p.id===player);
 if(selected<0)return alert("カードを選んでください");
 const card=me.hand.splice(selected,1)[0];
 selected=-1;
 const opponent=room.players.find(p=>p.id!==player);
 if(!opponent){
  me.hand.push(card);
  return alert("相手の参加を待っています。");
 }
 me.pick=card;
 if(!opponent.pick){
  el("result").textContent="相手の選択を待っています。";
  return;
 }
 judge();
}
function judge(){
 const a=room.players[0].pick,b=room.players[1].pick;
 let result="引き分け";
 if(a!==b){
  if((a==="rock"&&b==="scissors")||
     (a==="scissors"&&b==="paper")||
     (a==="paper"&&b==="rock"))result="プレイヤー1の勝ち";
  else result="プレイヤー2の勝ち";
 }
 room.result=symbols[a]+" VS "+symbols[b]+"\n"+result;
 room.players.forEach(p=>p.pick=null);
 room.round++;
 render();
}
el("create").onclick=create;
el("join").onclick=join;
el("discard").onclick=discard;
el("play").onclick=play;
</script>
</body>
</html>
